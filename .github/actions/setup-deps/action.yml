name: 'Setup Dependencies'
runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js LTS
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install Dependencies
      run: pnpm install --no-frozen-lockfile
      shell: bash
